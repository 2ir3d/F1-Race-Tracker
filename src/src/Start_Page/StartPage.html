<!DOCTYPE html>
<html lang="en">
<link rel="stylesheet" href="StartPage.css">
<head>
    <meta charset="UTF-8">
    <title>F1 Race Tracker</title>
</head>
<body>
    <div class="relative overflow-x-clip">

        <div class="header border-b-thin border-b-surface-neutral-4">
            <h1>F1 Race Tracker</h1>
        </div>

        <div class="border-b-thin border-b-surface-neutral-4">
            <div class="sr-only" role="heading" aria-level="2">Event Tracker</div>
            <div class="min-h-0 max-h-[100vw]">
                <div class="Container-module_container__01 border-b-thin border-b-surface-neutral-4">
                    <div class="Container-module_inner__01">
                        <div class="min-h-[56px] flex justify-between items-center py-px-8">
                            <div class="flex flex-col gap-px-4 items-start">
                                <a class="flex gap-px-4 items-center" href="https://www.formula1.com/en/racing/2026">
                                    <span class="typography-module_display-s-regular__01">Great Britain</span>
                                </a>
                                <div class="flex gap-px-12 items-center">
                                    <span class="typography-module_display-m-bold__01">Sprint</span>
                                    <div class="w-[1px] self-stretch bg-static opacity-20"></div>
                                    <div class="sr-only" role="timer">
                                        "Time to session:"
                                        "11"
                                        " hours, "
                                        "37"
                                        "minutes, "
                                        "20"
                                        " seconds"
                                    </div>
                                    <div class="flex gap-px-2 items-end" aria-hidden="true">
                                        <span class="typography-module_display-m-bold__01">00</span>
                                        <span class="typography-module_display-s-regular__01">H</span>
                                        <span class="typography-module_display-m-bold__01">00</span>
                                        <span class="typography-module_display-s-regular__01">M</span>
                                        <span class="typography-module_display-m-bold__01">00</span>
                                        <span class="typography-module_display-s-regular__01">S</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="buttons">
            <button onclick="window.location.href='../LiveRace/LiveRace.html'">Live Race</button>
            <button onclick="window.location.href='../Old_Races/OldRacesPage.html'">Old Races</button>
        </div>
    </div>
</body>
<footer>
    <blockquote>
        <p id="description">
            This is a short description lol :)
        </p>
    </blockquote>
</footer>
</html>
